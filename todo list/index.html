    <script>

    function addtask() {
        let Inputvalue = document.getElementById("taskbar");
        let list = document.getElementById("list")
        let taskvaluse =  Inputvalue.value;

        if (Inputvalue.value == "") {
          alert("Please enter a Value");
        } else {
          let li = document.createElement("li");
          li.innerText =  taskvaluse;
          list.appendChild(li);
          Inputvalue.value = ""
        }

    }
